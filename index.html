<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar system</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="image/favicon.ico">
</head>
<body>
    <h1>Solar system</h1>
    <p>Click anything in solar system to learn more about it</p>

    <div class="solar-system">

        <div class="sun">
            <a href="solar_system\sun.html">
                <img src="image\animations\sun.webp" alt="Sun" class="sun">
            </a>
        </div>

        <div class="orbit mercury-orbit">
            <a href="solar_system\mercury.html">
                <img src="image\animations\mercury.webp" alt="Sun" class="index-planet" height="30px" width="30px">        
            </a>
        </div>

        <div class="orbit venus-orbit">
            <a href="solar_system\venus.html">
                <img src="image\animations\venus.webp" alt="Venus" class="index-planet"  height="55px" width="55px">        
            </a>
        </div>

        <div class="orbit earth-orbit">
            <a href="href="solar_system\earth.html">
                <img src="image\animations\earth.webp" alt="Earth" class="index-planet" height="55px" width="55px">        
            </a>

            <div class="orbit moon-orbit">
                <a href="solar_system\moon.html">
                    <img src="image\animations\moon.webp" alt="Moon" class="index-planet" height="30px" width="30px">
                </a>
            </div>
        </div>
        
        <div class="orbit mars-orbit">
            <a href="solar_system\mars.html">
                <img src="image\animations\mars.webp" alt="Mars" class="index-planet" height="55px" width="55px">        
            </a>
        </div>

        <div class="orbit jupiter-orbit">
            <a href="solar_system\jupiter.html">
                <img src="image\animations\jupiter.webp" alt="Jupiter" class="index-planet" height="55px" width="55px">        
            </a>
        </div>

        <div class="orbit saturn-orbit">
            <a href="solar_system\saturn.html">
                <img src="image\animations\saturn.webp" alt="Saturn" class="index-planet" height="55px" width="55px">        
            </a>
        </div>

        <div class="orbit uranus-orbit">
            <a href="solar_system\uranus.html">
                <img src="image\animations\uranus.webp" alt="Uranus" class="index-planet" height="55px" width="55px">        
            </a>
        </div>

        <div class="orbit neptune-orbit">
            <a href="solar_system\neptune.html">
                <img src="image\animations\neptune.webp" alt="Neptune" class="index-planet" height="55px" width="55px">
            </a>
        </div>

    </div>

    <script>
        document.querySelectorAll('body > *').forEach((el, index) => {
            el.style.setProperty('--i', index);
        });
    </script>
    <button id="pause-btn">Pause/Start animation</button>
    <script>
        document.getElementById('pause-btn').addEventListener('click', () => {
            document.querySelector('.solar-system').classList.toggle('paused');
        });
    </script>
</body>
